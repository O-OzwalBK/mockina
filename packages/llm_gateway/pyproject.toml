[project]
name = "llm-gateway"
version = "0.1.0"
description = "One way to talk to any OpenAI-compatible language model: settings, context budget, retries, and clear errors."
readme = "README.md"
authors = [
    { name = "Mahakaal", email = "59462639+O-ozwal@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
contracts = { workspace = true }

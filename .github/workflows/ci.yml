name: CI

on:
  push:
    branches: [dev]

  pull_request:

permissions:
  contents: read
  
jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project and all workspace packages
        run: uv sync --locked --all-packages

      - name: Show Python version
        run: uv run --no-sync python --version

      - name: Linter
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Run tests
        run: uv run --no-sync pytest

      - name: Check generated docs are up to date
        run: |
          uv run --locked --all-packages python scripts/export_schemas.py
          test -z "$(git status --porcelain docs)"